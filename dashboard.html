<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Department of Financial Services</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <!-- Dashboard Header -->
    <header class="bg-white shadow fixed w-full top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Emblem_of_India.svg/90px-Emblem_of_India.svg.png" alt="Government of India Logo" class="h-12">
                    <div class="ml-4">
                        <h1 class="text-xl font-bold text-blue-900">Consumer Dashboard</h1>
                        <p class="text-sm text-gray-600">Department of Financial Services</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <button onclick="toggleNotifications()" class="relative flex items-center space-x-2 text-gray-700 hover:text-gray-900">
                            <i class="fas fa-bell text-xl"></i>
                            <span id="notificationCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">3</span>
                        </button>
                        <div id="notificationDropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg max-h-96 overflow-y-auto">
                            <div class="p-4 border-b flex justify-between items-center">
                                <h3 class="font-semibold">Notifications</h3>
                                <button onclick="clearNotifications()" class="text-sm text-blue-600 hover:text-blue-800">Clear All</button>
                            </div>
                            <div id="notificationList" class="p-2"></div>
                        </div>
                    </div>
                    <div class="relative">
                        <button onclick="toggleProfileMenu()" class="flex items-center space-x-2 text-gray-700 hover:text-gray-900">
                            <img src="https://ui-avatars.com/api/?name=Madhura+Sanap&background=0D8ABC&color=fff" alt="Profile" class="w-10 h-10 rounded-full">
                            <span class="hidden md:inline">Madhura Sanap</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div id="profileMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg">
                            <a href="#" onclick="loadContent('profile')" class="block px-4 py-2 hover:bg-gray-100"><i class="fas fa-user mr-2"></i>Profile</a>
                            <a href="#" onclick="loadContent('settings')" class="block px-4 py-2 hover:bg-gray-100"><i class="fas fa-cog mr-2"></i>Settings</a>
                            <hr class="my-2">
                            <a href="#" onclick="logout()" class="block px-4 py-2 hover:bg-gray-100 text-red-600"><i class="fas fa-sign-out-alt mr-2"></i>Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex mt-16">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-blue-900 text-white min-h-screen fixed left-0 top-16 overflow-y-auto">
            <nav class="p-4">
                <ul class="space-y-2">
                    <li>
                        <a href="#" onclick="loadContent('dashboard')" class="menu-item flex items-center space-x-3 p-3 rounded hover:bg-blue-800 bg-blue-800" data-page="dashboard">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="loadContent('accounts')" class="menu-item flex items-center space-x-3 p-3 rounded hover:bg-blue-800" data-page="accounts">
                            <i class="fas fa-university"></i>
                            <span>My Accounts</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="loadContent('schemes')" class="menu-item flex items-center space-x-3 p-3 rounded hover:bg-blue-800" data-page="schemes">
                            <i class="fas fa-hand-holding-usd"></i>
                            <span>My Schemes</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="loadContent('applications')" class="menu-item flex items-center space-x-3 p-3 rounded hover:bg-blue-800" data-page="applications">
                            <i class="fas fa-file-alt"></i>
                            <span>Applications</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="loadContent('transactions')" class="menu-item flex items-center space-x-3 p-3 rounded hover:bg-blue-800" data-page="transactions">
                            <i class="fas fa-history"></i>
                            <span>Transaction History</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="loadContent('documents')" class="menu-item flex items-center space-x-3 p-3 rounded hover:bg-blue-800" data-page="documents">
                            <i class="fas fa-file-download"></i>
                            <span>Documents</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="loadContent('support')" class="menu-item flex items-center space-x-3 p-3 rounded hover:bg-blue-800" data-page="support">
                            <i class="fas fa-headset"></i>
                            <span>Support</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="mainContent" class="flex-1 ml-64 p-8">
            <!-- Dynamic content will be loaded here -->
        </main>
    </div>

    <!-- Mobile Menu Toggle -->
    <button onclick="toggleSidebar()" class="md:hidden fixed bottom-4 right-4 bg-blue-600 text-white p-3 rounded-full shadow-lg z-50">
        <i class="fas fa-bars"></i>
    </button>

    <script src="dashboard.js"></script>
</body>
</html>
